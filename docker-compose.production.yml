services:
  engine:
    build:
      context: ./engine
    env_file:
      - ./.env.production
    environment:
      CONTEXTFORGE_ENV: ${CONTEXTFORGE_ENV:-production}
      CONTEXTFORGE_HOST: 0.0.0.0
      CONTEXTFORGE_PORT: 8001
      CONTEXTFORGE_WORKERS: ${CONTEXTFORGE_WORKERS:-2}
      CONTEXTFORGE_ALLOWED_ORIGINS: ${CONTEXTFORGE_ALLOWED_ORIGINS}
      HF_TOKEN: ${HF_TOKEN:-}
    expose:
      - "8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=5).read()",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: ./web
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      CONTEXTFORGE_API_URL: http://engine:8001
      NEXT_PUBLIC_CONTEXTFORGE_URL: ${NEXT_PUBLIC_CONTEXTFORGE_URL}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    restart: unless-stopped
